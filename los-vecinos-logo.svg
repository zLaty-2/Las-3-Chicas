<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Logo de Los Vecinos con cuatro personajes frente a un edificio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="560" fill="#1f1b45"/>
  <rect x="3" y="3" width="794" height="554" fill="none" stroke="#ffc83d" stroke-width="6"/>

  <!-- edificio de fondo -->
  <rect x="70" y="40" width="660" height="360" fill="#2c2760"/>
  <g fill="#ffc83d" stroke="#14112b" stroke-width="3">
    <rect x="100" y="62" width="50" height="50"/><rect x="190" y="62" width="50" height="50"/><rect x="280" y="62" width="50" height="50"/><rect x="370" y="62" width="50" height="50"/><rect x="460" y="62" width="50" height="50"/><rect x="550" y="62" width="50" height="50"/><rect x="640" y="62" width="50" height="50"/>
    <rect x="100" y="132" width="50" height="50"/><rect x="190" y="132" width="50" height="50"/><rect x="280" y="132" width="50" height="50"/><rect x="370" y="132" width="50" height="50"/><rect x="460" y="132" width="50" height="50"/><rect x="550" y="132" width="50" height="50"/><rect x="640" y="132" width="50" height="50"/>
  </g>
  <g fill="#14112b">
    <rect x="190" y="62" width="50" height="50"/><rect x="460" y="132" width="50" height="50"/>
  </g>

  <!-- Rolando (administrador) -->
  <g transform="translate(160,400) scale(1) translate(0,-190)">
    <path d="M-55 190 Q-50 70 0 62 Q50 70 55 190Z" fill="#4dabf7"/>
    <circle cx="0" cy="20" r="34" fill="#4dabf7"/>
    <path d="M0 66 L-9 92 L0 150 L9 92Z" fill="#fff"/>
    <path d="M-12 64 L0 78 L12 64" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="-12" cy="18" r="6" fill="#fff"/><circle cx="12" cy="18" r="6" fill="#fff"/>
    <path d="M-10 36 Q0 29 10 36" stroke="#fff" stroke-width="3" fill="none"/>
  </g>

  <!-- Doña Marta (chismosa) -->
  <g transform="translate(320,400) scale(0.95) translate(0,-190)">
    <path d="M-55 190 Q-50 70 0 62 Q50 70 55 190Z" fill="#ff6b9d"/>
    <circle cx="0" cy="-16" r="15" fill="#ff6b9d"/>
    <circle cx="0" cy="20" r="34" fill="#ff6b9d"/>
    <circle cx="-13" cy="18" r="9" fill="#fff"/><circle cx="13" cy="18" r="9" fill="#fff"/>
    <circle cx="-13" cy="18" r="3.5" fill="#14112b"/><circle cx="13" cy="18" r="3.5" fill="#14112b"/>
    <path d="M-9 36 Q0 43 9 36" stroke="#fff" stroke-width="3" fill="none"/>
  </g>

  <!-- Tito (portero) -->
  <g transform="translate(480,400) scale(0.9) translate(0,-190)">
    <path d="M-55 190 Q-50 70 0 62 Q50 70 55 190Z" fill="#ffc83d"/>
    <circle cx="0" cy="20" r="34" fill="#ffc83d"/>
    <path d="M-36 8 Q-36 -26 0 -26 Q36 -26 36 8Z" fill="#ffc83d" stroke="#fff" stroke-width="3"/>
    <path d="M-40 8 L52 8 L52 16 L-40 16Z" fill="#ffc83d" stroke="#fff" stroke-width="3"/>
    <circle cx="-12" cy="26" r="6" fill="#fff"/><circle cx="12" cy="26" r="6" fill="#fff"/>
    <rect x="-8" y="100" width="16" height="16" fill="#fff"/>
  </g>

  <!-- Vico (el del ruido) -->
  <g transform="translate(640,400) scale(0.85) translate(0,-190)">
    <path d="M-55 190 Q-50 70 0 62 Q50 70 55 190Z" fill="#51cf66"/>
    <circle cx="0" cy="20" r="34" fill="#51cf66"/>
    <path d="M-38 20 Q-38 -24 0 -24 Q38 -24 38 20" fill="none" stroke="#fff" stroke-width="13"/>
    <path d="M-38 20 Q-38 -24 0 -24 Q38 -24 38 20" fill="none" stroke="#51cf66" stroke-width="7"/>
    <rect x="-48" y="8" width="14" height="26" fill="#51cf66" stroke="#fff" stroke-width="3"/>
    <rect x="34" y="8" width="14" height="26" fill="#51cf66" stroke="#fff" stroke-width="3"/>
    <circle cx="-12" cy="22" r="6" fill="#fff"/><circle cx="12" cy="22" r="6" fill="#fff"/>
    <path d="M-10 38 Q0 46 10 38" stroke="#fff" stroke-width="3" fill="none"/>
  </g>

  <!-- piso -->
  <rect x="40" y="400" width="720" height="22" fill="#14112b"/>

  <!-- título -->
  <text x="400" y="500" text-anchor="middle" font-family="'Bebas Neue',Impact,'Arial Black',sans-serif" font-size="96" letter-spacing="8" fill="#ffc83d">LOS VECINOS</text>
  <text x="400" y="535" text-anchor="middle" font-family="'Special Elite','Courier New',monospace" font-size="18" letter-spacing="4" fill="#f4f1ff">UN CÓMIC EN BLANCO Y NEGRO</text>
</svg>
